<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моника</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:560px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 14px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input[type=text],input[type=password],select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:var(--fg);padding:9px 11px;font-size:14px}
input[type=range]{width:100%}
button{background:#21262d;color:var(--fg);border:1px solid #30363d;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px}
button.primary{background:#1f4fd1;border-color:#1f4fd1;color:#fff}
button:hover{filter:brightness(1.2)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.mod{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mod .t{font-weight:600}.mod .d{color:var(--dim);font-size:12px}
.tg{position:relative;width:44px;height:24px;background:#30363d;border-radius:12px;cursor:pointer;flex:none;transition:.2s}
.tg.on{background:var(--ok)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg.on::after{left:23px}
.key{margin:10px 0}.key .d{font-size:12px;color:var(--dim)}
.step{font-size:12px;color:var(--dim);margin-bottom:6px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:18px}
.bar i{display:block;height:4px;background:var(--acc);border-radius:2px;transition:.3s}
.sum{font-size:13px;color:var(--dim);line-height:1.8}
.sum b{color:var(--fg)}
.warn{border:1px solid #d29922;border-radius:8px;padding:10px;font-size:13px;color:#d29922;margin:10px 0}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.hidden{display:none}
.chip{display:inline-block;border:1px solid #30363d;border-radius:20px;padding:5px 13px;margin:4px 6px 4px 0;cursor:pointer;font-size:13px}
.chip.sel{border-color:var(--acc);color:var(--acc)}
.app{max-width:900px}
.apps{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.apps a{color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="/web/app.js"></script>
</body>
</html>
